
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGG FINDER RADAR</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:white;
 font-family:Arial;text-align:center
}
header{
 background:#14213b;padding:24px;
 border-bottom:2px solid #25ddff
}
h1{color:#25ddff;font-size:32px}
.panel{
 background:#14213b;margin:18px auto;
 padding:20px;border-radius:15px;
 max-width:550px
}
button{
 background:#25ddff;color:#07101e;
 border:0;padding:14px 20px;
 border-radius:9px;font-weight:bold;
 margin:8px
}
button:disabled{opacity:.5}
.server{
 background:#243653;padding:15px;
 margin:12px 0;border-radius:10px
}
a{color:#25ddff;font-weight:bold}
#estado{color:#25ddff}
</style>
</head>
<body>

<header>
<h1>🥚 EGG FINDER</h1>
<p>RADAR DE HUEVOS GRANDES</p>
</header>

<div class="panel">
<h2>📡 RADAR AUTOMÁTICO</h2>
<p id="radar">Esperando datos de huevos...</p>
<p>La detección de huevos dentro de cada servidor requiere datos adicionales del juego.</p>
</div>

<div class="panel">
<h2>🌎 SERVIDORES PÚBLICOS</h2>
<p id="estado">Listo para buscar</p>
<button id="btn" onclick="buscarServidores()">BUSCAR 100 SERVIDORES</button>
<div id="servers"></div>
</div>

<script>
const PLACE_ID="107778070777162";
const PROXY="https://proxy.cors.dev/https://games.roblox.com";
let cursor="";
let buscando=false;

async function buscarServidores(){
 if(buscando)return;
 buscando=true;

 const btn=document.getElementById("btn");
 const lista=document.getElementById("servers");
 const estado=document.getElementById("estado");

 btn.disabled=true;
 estado.textContent="Buscando servidores...";
 lista.innerHTML="";

 try{
  let url=PROXY+"/v1/games/"+PLACE_ID+
  "/servers/Public?limit=100&sortOrder=Asc";

  const respuesta=await fetch(url);

  if(respuesta.status===429){
   throw new Error("Roblox está limitando las consultas. Intenta más tarde.");
  }
  if(!respuesta.ok){
   throw new Error("Error HTTP "+respuesta.status);
  }

  const datos=await respuesta.json();

  if(!datos.data || datos.data.length===0){
   estado.textContent="No se encontraron servidores.";
   return;
  }

  estado.textContent=datos.data.length+
  " servidores encontrados.";

  datos.data.forEach((s,i)=>{
   const tarjeta=document.createElement("div");
   tarjeta.className="server";

   const titulo=document.createElement("h3");
   titulo.textContent="🥚 Servidor "+(i+1);

   const jugadores=document.createElement("p");
   jugadores.textContent="Jugadores: "+
   s.playing+"/"+s.maxPlayers;

   const ping=document.createElement("p");
   ping.textContent="Ping: "+
   (s.ping==null?"No disponible":s.ping+" ms");

   const entrar=document.createElement("a");
   entrar.textContent="ENTRAR AL SERVIDOR";
   entrar.href="https://www.roblox.com/games/start?placeId="+
   PLACE_ID+"&gameInstanceId="+encodeURIComponent(s.id);
   entrar.target="_blank";
   entrar.rel="noopener";

   tarjeta.append(titulo,jugadores,ping,entrar);
   lista.appendChild(tarjeta);
  });

  if(datos.nextPageCursor){
   estado.textContent+=" Hay más páginas de resultados disponibles.";
  }

 }catch(error){
  estado.textContent=error.message;
 }finally{
  buscando=false;
  btn.disabled=false;
 }
}
</script>
</body>
</html>
