
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EGG FINDER RADAR</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d19;color:white;font-family:Arial;text-align:center}
header{background:#111d35;padding:22px;border-bottom:2px solid #27dfff}
h1{color:#27dfff}
.panel{background:#14213b;margin:18px auto;padding:20px;border-radius:15px;max-width:500px}
button{background:#27dfff;color:#07101e;border:0;padding:13px 20px;border-radius:9px;font-weight:bold;margin:8px}
.item{background:#202f4b;margin:10px;padding:14px;border-radius:10px}
.status{color:#27dfff}
</style>
</head>
<body>
<header>
<h1>🥚 EGG FINDER</h1>
<p>RADAR DE HUEVOS GRANDES</p>
</header>
<div class="panel">
<h2>📡 RADAR AUTOMÁTICO</h2>
<p class="status" id="estado">RADAR SIN CONECTAR</p>
<button onclick="buscar()">ACTUALIZAR RADAR</button>
<div id="huevos">
<div class="item">Esperando datos reales de huevos...</div>
</div>
</div>
<div class="panel">
<h2>🌎 SERVIDORES</h2>
<button onclick="servidores()">BUSCAR SERVIDORES</button>
<div id="servers">Todavía no hay servidores cargados.</div>
</div>
<script>
function buscar(){
document.getElementById("estado").textContent="ESPERANDO FUENTE DE DATOS";
document.getElementById("huevos").innerHTML=
'<div class="item">El radar necesita una conexión de datos del juego.</div>';
}
function servidores(){
document.getElementById("servers").textContent=
"Falta conectar la consulta pública de servidores de Roblox.";
}
</script>
</body>
</html>
